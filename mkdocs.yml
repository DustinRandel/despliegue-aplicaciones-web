site_name: Despliegue de aplicaciones web
site_description: Apuntes y prácticas del módulo 0614 - 2º DAW
site_author: Dustin Randel de Lara García
site_url: https://dustinrandel.github.io/despliegue-aplicaciones-web/
repo_url: https://github.com/DustinRandel/despliegue-aplicaciones-web
edit_uri: ""   # sin botón «editar»

copyright: >
  Dustin Randel de Lara García, Sant Josep Obrer. Material docente del módulo 0614.
  Contiene obras derivadas de terceros; ver la página de Créditos.

theme:
  name: material
  custom_dir: overrides   # favicons de 48 px y .ico
  language: es
  logo: assets/logo.png       # icono de Dustin (compás blanco con Ø)
  favicon: assets/favicon.png
  font:
    text: Carlito
    code: Roboto Mono
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
  features:
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

markdown_extensions:
  - meta
  - tables
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
      toc_depth: 3

plugins:
  - search:
      lang: es
  - awesome-pages:
      collapse_single_pages: true

extra_css:
  - stylesheets/extra.css

# Quita las notas para el profesor (comentarios HTML) de la web publicada
hooks:
  - hooks/notas_profesor.py
